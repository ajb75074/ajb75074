<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Boarding pass. Passenger: Avanie Baptiste. From UGA Computer Science 2026 to your team. Class: Design and Engineering. Seat: full-stack. Status: open to roles.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16112E"/>
      <stop offset="1" stop-color="#2A1B4A"/>
    </linearGradient>
    <linearGradient id="stub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7EB6"/>
      <stop offset="1" stop-color="#C3A6FF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- ticket silhouette with notches at the perforation -->
    <mask id="ticket">
      <rect width="1000" height="330" rx="26" fill="#fff"/>
      <circle cx="730" cy="0" r="18" fill="#000"/>
      <circle cx="730" cy="330" r="18" fill="#000"/>
    </mask>
  </defs>
  <style>
    .sans { font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Courier New', monospace; }
    .serif { font-family: 'Playfair Display', Didot, Georgia, serif; }
    .lbl { font-size: 11px; letter-spacing: 3px; fill: #8F86B5; }
    .val { font-size: 20px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 13px; fill: #B9B0D9; }
    .in { opacity: 0; animation: in .8s ease forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    .shine { animation: sweep 5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-400px) } 60%,100% { transform: translateX(1100px) } }
    .blink { animation: blink 1.4s steps(1) infinite; }
    @keyframes blink { 50% { opacity: .2 } }
    .fly { animation: fly 3.5s ease-in-out infinite; }
    @keyframes fly { 0%,100% { transform: translateX(0) } 50% { transform: translateX(14px) } }
    .scan { animation: scan 2.6s ease-in-out infinite; }
    @keyframes scan { 0%,100% { transform: translateY(0) } 50% { transform: translateY(136px) } }
  </style>

  <g mask="url(#ticket)">
    <rect width="1000" height="330" fill="url(#bg)"/>
    <rect x="730" width="270" height="330" fill="url(#stub)" opacity=".95"/>
    <g transform="skewX(-20)"><rect class="shine" x="0" y="0" width="300" height="330" fill="url(#shine)"/></g>
  </g>
  <line x1="730" y1="24" x2="730" y2="306" stroke="#0B0B1F" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>

  <!-- header -->
  <g class="mono">
    <text x="40" y="50" font-size="13" letter-spacing="5" fill="#FF7EB6">AVANIE AIR</text>
    <text x="700" y="50" font-size="13" letter-spacing="3" fill="#8F86B5" text-anchor="end">BOARDING PASS · FIRST-CLASS UX</text>
  </g>
  <line x1="40" y1="68" x2="700" y2="68" stroke="#FFFFFF" stroke-opacity=".1"/>

  <!-- route -->
  <g class="in" style="animation-delay:.1s">
    <text class="mono lbl" x="40" y="104">FROM</text>
    <text class="serif" x="38" y="150" font-size="52" font-weight="700" fill="#FFFFFF">UGA</text>
    <text class="sans sub" x="40" y="176">CS ’26 · Magna Cum Laude · HCI focus</text>

    <g transform="translate(300 118)"><g class="fly">
      <line x1="-60" y1="10" x2="90" y2="10" stroke="#FF7EB6" stroke-opacity=".5" stroke-width="2" stroke-dasharray="3 7"/>
      <path d="M2 8 L32 8 Q37 8 37 10 Q37 12 32 12 L2 12 Z M14 9 L6 -4 L11 -4 L22 9 Z M14 11 L6 24 L11 24 L22 11 Z M2 9 L-2 2 L2 2 L6 9 Z" fill="#FFC8A2"/>
    </g></g>

    <text class="mono lbl" x="450" y="104">TO</text>
    <text class="serif" x="448" y="150" font-size="52" font-weight="700" fill="#FFFFFF">YOU</text>
    <text class="sans sub" x="450" y="176">your product &amp; engineering team</text>
  </g>

  <!-- detail grid -->
  <g class="in" style="animation-delay:.4s">
    <text class="mono lbl" x="40" y="222">PASSENGER</text>
    <text class="sans val" x="40" y="248">AVANIE BAPTISTE</text>

    <text class="mono lbl" x="260" y="222">CLASS</text>
    <text class="sans val" x="260" y="248">DESIGN × ENG</text>

    <text class="mono lbl" x="450" y="222">SEAT</text>
    <text class="sans val" x="450" y="248">FULL-STACK</text>

    <text class="mono lbl" x="600" y="222">GATE</text>
    <text class="sans val" x="600" y="248">HCI</text>
  </g>
  <g class="in mono" style="animation-delay:.7s">
    <rect x="40" y="272" width="250" height="32" rx="16" fill="#7CF2B0" fill-opacity=".12" stroke="#7CF2B0" stroke-opacity=".5"/>
    <circle class="blink" cx="60" cy="288" r="5" fill="#7CF2B0"/>
    <text x="74" y="293" font-size="12" letter-spacing="2" fill="#7CF2B0">STATUS: OPEN TO ROLES</text>
    <text x="310" y="293" font-size="12" letter-spacing="1.5" fill="#8F86B5">React Native · UX/Product · AI Product</text>
  </g>

  <!-- stub -->
  <g class="mono" fill="#0B0B1F">
    <text x="760" y="50" font-size="12" letter-spacing="4">FLIGHT</text>
    <text x="760" y="82" font-size="28" font-weight="700" class="sans">AVN 026</text>
    <text x="760" y="112" font-size="12" letter-spacing="3">ATL · GA · EST</text>
  </g>
  <!-- barcode -->
  <g transform="translate(760 132)" fill="#0B0B1F">
    <rect x="0" width="4" height="120"/><rect x="8" width="2" height="120"/><rect x="13" width="6" height="120"/>
    <rect x="23" width="2" height="120"/><rect x="28" width="3" height="120"/><rect x="35" width="7" height="120"/>
    <rect x="46" width="2" height="120"/><rect x="51" width="4" height="120"/><rect x="59" width="2" height="120"/>
    <rect x="64" width="6" height="120"/><rect x="74" width="3" height="120"/><rect x="80" width="2" height="120"/>
    <rect x="86" width="5" height="120"/><rect x="95" width="2" height="120"/><rect x="100" width="7" height="120"/>
    <rect x="111" width="3" height="120"/><rect x="118" width="2" height="120"/><rect x="123" width="5" height="120"/>
    <rect x="132" width="2" height="120"/><rect x="137" width="4" height="120"/><rect x="145" width="7" height="120"/>
    <rect x="156" width="2" height="120"/><rect x="161" width="3" height="120"/><rect x="168" width="6" height="120"/>
    <rect x="178" width="2" height="120"/><rect x="184" width="4" height="120"/><rect x="192" width="2" height="120"/>
    <rect x="198" width="5" height="120"/>
    <rect class="scan" x="-6" y="-14" width="216" height="3" fill="#FFFFFF" opacity=".85"/>
  </g>
  <text x="760" y="290" class="mono" font-size="11" letter-spacing="2" fill="#0B0B1F">AVANIE.CO</text>
</svg>
