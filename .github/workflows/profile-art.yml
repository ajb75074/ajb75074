name: Profile art (snake + 3D contributions)

on:
  schedule:
    - cron: "17 9 * * *"   # daily, ~5am Atlanta time
  workflow_dispatch:        # run it by hand from the Actions tab
  push:
    branches: [main]
    paths: [".github/**"]

permissions:
  contents: write

jobs:
  snake:
    name: Contribution snake
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#E0468F&color_dots=#F4EFFB,#E5CCFF,#C9A2FF,#FF9CC8,#E0468F
            dist/snake-dark.svg?color_snake=#FFC8A2&color_dots=#1E1640,#4B2A7A,#8A4FC2,#D06AC8,#FF7EB6
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contrib-3d:
    name: 3D contribution skyline
    runs-on: ubuntu-latest
    needs: snake
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/3d-contrib.json
      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          if git commit -m "chore: refresh 3D contribution graph"; then
            git push
          fi
